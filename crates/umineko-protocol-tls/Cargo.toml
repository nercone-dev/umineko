[package]
name = "umineko-protocol-tls"
description = "TLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["tls10", "tls11", "tls12", "tls13", "dtls", "mtls", "quic"]
tls10 = []
tls11 = []
tls12 = []
tls13 = ["dep:umineko-crypto-hkdf"]
dtls = ["dep:umineko-protocol-udp", "dep:umineko-crypto-hkdf"]
mtls = []
quic = ["tls13"]

[dependencies]
umineko-helpers = { workspace = true }
umineko-protocol-ip = { workspace = true, default-features = true }
umineko-protocol-tcp = { workspace = true, default-features = true }
umineko-protocol-udp = { workspace = true, default-features = true, optional = true }
umineko-hash-md = { workspace = true, features = ["md5"] }
umineko-hash-sha = { workspace = true, features = ["sha1", "sha2"] }
umineko-hash-sm3 = { workspace = true }
umineko-hash-streebog = { workspace = true }
umineko-crypto-hmac = { workspace = true }
umineko-crypto-hkdf = { workspace = true, optional = true }
umineko-crypto-kdftree = { workspace = true }
umineko-crypto-aes = { workspace = true }
umineko-crypto-aria = { workspace = true }
umineko-crypto-camellia = { workspace = true }
umineko-crypto-chacha20 = { workspace = true }
umineko-crypto-poly1305 = { workspace = true }
umineko-crypto-des = { workspace = true }
umineko-crypto-idea = { workspace = true }
umineko-crypto-rc2 = { workspace = true }
umineko-crypto-rc4 = { workspace = true }
umineko-crypto-seed = { workspace = true }
umineko-crypto-sm4 = { workspace = true }
umineko-crypto-aegis = { workspace = true }
umineko-crypto-ascon = { workspace = true }
umineko-crypto-gost = { workspace = true }
umineko-crypto-rsa = { workspace = true }
umineko-crypto-dh = { workspace = true }
umineko-crypto-dsa = { workspace = true }
umineko-crypto-ecdh = { workspace = true }
umineko-crypto-ecdsa = { workspace = true }
umineko-crypto-eddsa = { workspace = true }
umineko-crypto-mlkem = { workspace = true }
umineko-crypto-mldsa = { workspace = true }
umineko-crypto-hybrid = { workspace = true, default-features = true }
umineko-crypto-sm2 = { workspace = true }
umineko-crypto-gostr3410 = { workspace = true }
umineko-crypto-srp = { workspace = true }
umineko-crypto-dragonfly = { workspace = true }
