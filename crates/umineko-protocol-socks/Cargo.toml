[package]
name = "umineko-protocol-socks"
description = "SOCKS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
umineko-protocol-ip = { workspace = true, default-features = true }
umineko-protocol-tcp = { workspace = true, default-features = true }
umineko-protocol-udp = { workspace = true, default-features = true, optional = true }
umineko-protocol-dns = { workspace = true, default-features = true }

[features]
default = ["socks4", "socks5"]
socks4 = []
socks5 = ["dep:umineko-protocol-udp"]
